<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>AI简历诊断</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    textarea { width: 100%; height: 200px; padding: 10px; font-size: 14px; }
    button { margin-top: 10px; padding: 10px 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    #result { margin-top: 20px; white-space: pre-wrap; background: #f5f5f5; padding: 20px; border-radius: 8px; display: none; }
  </style>
</head>
<body>
  <h1>AI简历诊断</h1>
  <p>把你的简历粘贴进来，AI帮你诊断。</p>
  <textarea id="resume" placeholder="把经历按「做了什么、怎么做的、结果如何」随便写，不用讲究格式"></textarea>
  <br>
  <button onclick="diagnose()">开始诊断</button>
  <div id="result"></div>

  <script>
    async function diagnose() {
      const resume = document.getElementById('resume').value;
      const resultDiv = document.getElementById('result');
      resultDiv.style.display = 'block';
      resultDiv.textContent = '诊断中，请稍等...';

      const response = await fetch('/api/diagnose', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ resume })
      });
      const data = await response.json();
      resultDiv.textContent = data.result;
    }
  </script>
</body>
</html>
